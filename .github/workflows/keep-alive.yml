name: Keep Backend Alive

on:
  schedule:
    # Every 12 minutes — well within Render's 15-min sleep window
    - cron: '*/12 * * * *'
  workflow_dispatch: # Manual trigger for testing

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          curl -sf --max-time 120 --retry 2 --retry-delay 10 \
            "${{ secrets.BACKEND_URL }}/healthz" \
            && echo "✅ Backend is alive" \
            || echo "⚠️ Backend may be waking up (this is normal)"

