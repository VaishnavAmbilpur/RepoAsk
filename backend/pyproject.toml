[project]
name = "codeatlas-backend"
version = "0.1.0"
description = "Backend API and Ingestion Engine for CodeAtlas"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "libsql-client>=0.3.0",
    "fastembed>=0.4.0",
    "langchain-text-splitters>=0.3.0",
    "langgraph>=0.2.0",
    "httpx>=0.27.0",
    "gitpython>=3.1.43",
    "python-dotenv>=1.0.1",
    "langchain-openai>=1.8.5",
    "rank-bm25>=0.2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
